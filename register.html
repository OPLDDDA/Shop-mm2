<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация — MM2 Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <h2>Регистрация</h2>
    <form>
      <input type="text" placeholder="Логин (мин. 3)" required minlength="3">
      <input type="password" placeholder="Пароль (мин. 6)" required minlength="6">
      <input type="password" placeholder="Повторите пароль" required minlength="6">
      <button type="submit" class="btn-primary">Создать аккаунт</button>
    </form>
    <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
    <a href="index.html" class="back-link">← На главную</a>
  </div>
</body>
</html>
